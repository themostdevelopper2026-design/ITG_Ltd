<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITG-Pulse — Connexion</title>
  <meta name="description" content="Application de gestion interne ITG-Pulse — Connexion sécurisée">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'itg-blue': '#003882',
            'itg-orange': '#F28C28',
            'itg-light': '#29ABE2',
            'sidebar': '#0d1b2e',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @keyframes float1 { 0%,100%{transform:translateY(0) rotate(0deg)} 33%{transform:translateY(-25px) rotate(5deg)} 66%{transform:translateY(12px) rotate(-3deg)} }
    @keyframes float2 { 0%,100%{transform:translateY(0) rotate(0deg)} 33%{transform:translateY(18px) rotate(-6deg)} 66%{transform:translateY(-15px) rotate(4deg)} }
    @keyframes float3 { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-20px) scale(1.05)} }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
    @keyframes gridShift { 0%{background-position:0 0} 100%{background-position:50px 50px} }
    .blob1{animation:float1 10s ease-in-out infinite}
    .blob2{animation:float2 13s ease-in-out infinite 2s}
    .blob3{animation:float3 8s ease-in-out infinite 1s}
    .card-appear{animation:slideUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);background-size:50px 50px;animation:gridShift 8s linear infinite}
    .btn-login{background:linear-gradient(135deg,#003882 0%,#1e40af 50%,#29ABE2 100%);background-size:200% auto;transition:background-position 0.4s ease,transform 0.2s,box-shadow 0.3s}
    .btn-login:hover{background-position:right center;box-shadow:0 8px 25px rgba(0,56,130,0.35)}
    .btn-login:active{transform:scale(0.98)}
    .input-focus:focus{border-color:#003882;box-shadow:0 0 0 3px rgba(0,56,130,0.12);outline:none}
    .demo-card{transition:all 0.2s ease}
    .demo-card:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,0.08)}
  </style>
</head>
<body class=" bg-itg-lightbg min-h-screen font-sans overflow-hidden relative">

  <!-- Animated background blobs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="blob1 absolute -top-32 -left-32 w-[500px] h-[500px] rounded-full opacity-20" style="background:radial-gradient(circle,#003882,transparent 70%)"></div>
    <div class="blob2 absolute top-1/3 -right-40 w-[450px] h-[450px] rounded-full opacity-15" style="background:radial-gradient(circle,#29ABE2,transparent 70%)"></div>
    <div class="blob3 absolute -bottom-32 left-1/3 w-[400px] h-[400px] rounded-full opacity-10" style="background:radial-gradient(circle,#F28C28,transparent 70%)"></div>
    <div class="absolute top-1/2 left-1/4 w-64 h-64 rounded-full opacity-10" style="background:radial-gradient(circle,#1e40af,transparent 70%);animation:float3 12s ease-in-out infinite 3s"></div>
  </div>
  <!-- Grid overlay -->
  <div class="grid-bg absolute inset-0 opacity-100 pointer-events-none"></div>

  <!-- Centered login card -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">

      <!-- Card -->
      <div class="card-appear bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- Top banner -->
        <div class="h-1.5 w-full" style="background:linear-gradient(90deg,#003882,#29ABE2,#F28C28,#003882);background-size:200% auto;animation:gridShift 3s linear infinite"></div>

        <div class="p-8">
          <!-- Logo + Title -->
          <div class="text-center mb-8">
            <div class="flex justify-center mb-5">
              <img src="../public/images/ITG2.png" alt="ITG Logo" class="h-16 w-auto" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
              <div id="logo-fallback" class="hidden items-center gap-2">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-black text-xl" style="background:#003882">ITG</div>
              </div>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Application de Gestion Interne</h1>
            <p class="text-gray-400 text-sm mt-1">Connectez-vous à <span class="text-itg-blue font-semibold">ITG-Pulse</span></p>
          </div>

          <!-- Form -->
          <form id="login-form" class="space-y-4" autocomplete="off">

            <!-- Email -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Adresse e-mail</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none">
                  <svg class="w-4.5 h-4.5 text-gray-400" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                  </svg>
                </div>
                <input id="email" type="email" placeholder="votre@email.com" required autocomplete="off" value=""
                  class="input-focus w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 transition-all">
              </div>
            </div>

            <!-- Password -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none">
                  <svg class="w-4.5 h-4.5 text-gray-400" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                </div>
                <input id="password" type="password" placeholder="••••••••" required autocomplete="new-password" value=""
                  class="input-focus w-full pl-10 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 transition-all">
                <button type="button" id="toggle-pwd" class="absolute inset-y-0 right-3.5 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                  <svg id="eye-show" class="w-4.5 h-4.5" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Options -->
            <div class="flex items-center justify-between text-sm">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 rounded text-itg-blue border-gray-300">
                <span class="text-gray-500">Se souvenir de moi</span>
              </label>
              <a href="#" class="text-itg-blue font-medium hover:underline">Mot de passe oublié ?</a>
            </div>

            <!-- Error msg -->
            <div id="err-msg" class="hidden flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 text-sm">
              <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Identifiants incorrects. Vérifiez votre email et mot de passe.
            </div>

            <!-- Submit -->
            <button type="submit" id="login-btn" class="btn-login w-full py-3.5 text-white font-semibold rounded-xl text-sm flex items-center justify-center gap-2">
              <span id="btn-label">Se connecter</span>
              <div id="btn-spin" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            </button>

          </form>

        </div><!-- end p-8 -->
      </div><!-- end card -->

      <!-- Footer -->
      <p class="text-center text-xs mt-5" style="color:rgba(255,255,255,0.3)">
        © 2024 ITG — Innovation Technology Group · Tous droits réservés
      </p>

    </div>
  </div>

  <script>
    // Mock users database
    const USERS = {
      'admin@itg.bi':      { password:'admin123',  role:'admin',       prenom:'Jean',   nom:'Niyonzima',   titre:'Directeur Général' },
      'jean@itg.bi':       { password:'chef123',   role:'chef_projet', prenom:'Jean',   nom:'Hakizimana',  titre:'Chef de Projet' },
      'commercial@itg.bi': { password:'crm123',    role:'commercial',  prenom:'Alice',  nom:'Ndayishimiye',titre:'Responsable Commercial' },
      'formateur@itg.bi':  { password:'form123',   role:'formateur',   prenom:'Pierre', nom:'Nkurunziza',  titre:'Formateur Senior' },
      'support@itg.bi':    { password:'sav123',    role:'technicien',  prenom:'Marie',  nom:'Uwimana',     titre:'Technicienne Support' },
    };

    // Clear fields on page load to prevent unwanted browser autofill
    window.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      if (form) form.reset();
    });

    document.getElementById('toggle-pwd').addEventListener('click', () => {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pwd = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const lbl = document.getElementById('btn-label');
      const spin = document.getElementById('btn-spin');
      const err = document.getElementById('err-msg');

      btn.disabled = true;
      lbl.textContent = 'Connexion en cours...';
      spin.classList.remove('hidden');
      err.classList.add('hidden');

      setTimeout(() => {
        const user = USERS[email];
        if (user && user.password === pwd) {
          localStorage.setItem('itg_user', JSON.stringify({
            email, role:user.role, prenom:user.prenom, nom:user.nom, titre:user.titre,
            token: 'mock_' + Date.now()
          }));
          window.location.href = 'index.html';
        } else {
          btn.disabled = false;
          lbl.textContent = 'Se connecter';
          spin.classList.add('hidden');
          err.classList.remove('hidden');
        }
      }, 1300);
    });
  </script>
</body>
</html>
